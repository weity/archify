<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archify 系统图册</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --text: #0f172a;
        --text-muted: #64748b;
        --accent: #0284c7;
        --border: #e2e8f0;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }
    header {
      text-align: center;
      margin-bottom: 3rem;
    }
    h1 {
      font-size: 2.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
    }
    .atlas-tree {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .level {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem 1.5rem;
      transition: border-color 0.2s;
    }
    .level:hover {
      border-color: var(--accent);
    }
    .level-header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.5rem;
    }
    .level-badge {
      background: var(--accent);
      color: var(--bg);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 0.25rem;
      text-transform: uppercase;
    }
    .level-title {
      font-size: 1.25rem;
      font-weight: 600;
    }
    .level-title a {
      color: var(--text);
      text-decoration: none;
    }
    .level-title a:hover {
      color: var(--accent);
    }
    .level-meta {
      display: flex;
      gap: 1rem;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    .type-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }
    .type-tag::before {
      content: '';
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: var(--accent);
    }
    .children {
      margin-top: 1rem;
      padding-left: 1.5rem;
      border-left: 2px solid var(--border);
    }
    .child-item {
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border);
    }
    .child-item:last-child {
      border-bottom: none;
    }
    .child-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .child-link:hover {
      text-decoration: underline;
    }
    .child-type {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-left: 0.5rem;
    }
    footer {
      margin-top: 3rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
    }
    footer a {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Archify 系统图册</h1>
      <p class="subtitle">JSON-IR 图表渲染引擎的完整架构与实现细节</p>
    </header>
    
    <nav class="atlas-tree">
      <div class="level">
        <div class="level-header">
          <span class="level-badge">L0</span>
          <span class="level-title"><a href="00-system.architecture.html">系统概览</a></span>
        </div>
        <div class="level-meta">
          <span class="type-tag">architecture</span>
          <span>Archify 核心组件：渲染器、Viewer、CLI 和分发工具</span>
        </div>
        
        <div class="children">
          <div class="child-item">
            <a class="child-link" href="10-cli.architecture.html">CLI 模块</a>
            <span class="child-type">(architecture) — 待生成</span>
          </div>
          <div class="child-item">
            <a class="child-link" href="11-renderers.architecture.html">渲染器集群</a>
            <span class="child-type">(architecture) — 待生成</span>
          </div>
          <div class="child-item">
            <a class="child-link" href="12-viewer.architecture.html">Viewer 模块</a>
            <span class="child-type">(architecture) — 待生成</span>
          </div>
        </div>
      </div>
    </nav>
    
    <footer>
      <p>Generated by <a href="https://github.com/tt-a1i/archify">Archify</a></p>
    </footer>
  </div>
</body>
</html>
